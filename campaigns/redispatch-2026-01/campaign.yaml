description: >
  Vorsätzlicher EU-Rechtsbruch: Der Redispatch-Vorbehalt verstößt frontal gegen Art. 13 Abs. 7 VO (EU) 2019/943 – während Lobbyisten frech zugeben, im „Team Bundesregierung“ zu spielen!
